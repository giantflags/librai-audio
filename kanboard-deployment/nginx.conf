# Nginx Configuration for Kanboard Reverse Proxy
# Place this file at: /etc/nginx/sites-available/kanboard
# Enable with: ln -s /etc/nginx/sites-available/kanboard /etc/nginx/sites-enabled/

# ==============================================================================
# HTTP Server Block (Redirect to HTTPS - Recommended for Production)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name tasks.verslib.re;

    # Redirect all HTTP traffic to HTTPS
    # Comment out this section if not using SSL
    # return 301 https://$server_name$request_uri;

    # OR keep HTTP-only for development/testing:
    location / {
        proxy_pass http://127.0.0.1:8080;

        # Essential headers for OAuth redirect
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;

        # Don't pass sensitive headers to backend
        proxy_hide_header X-Powered-By;
    }

    # Increase max upload size for file attachments
    client_max_body_size 50M;
}

